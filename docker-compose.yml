name: tax-inspection-database-backend
services:
  postgres:
    image: postgis/postgis:17-3.5-alpine # PostgreSQL 17 + PostGIS for maps/GIS
    container_name: tax_database
    restart: unless-stopped
    cpus: 1.5
    mem_limit: 1g
    mem_reservation: 512m

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: tax_pgadmin
    restart: unless-stopped
    cpus: 0.5
    mem_limit: 512m
    mem_reservation: 128m
    environment:
     PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL?:set an email}
     PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD?:set a password}
    ports:
    - "${PGADMIN_PORT}"
    volumes:
    - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
          
        

volumes:
  postgres_data: #save the data 
  pgadmin_data:  #save mangment info 